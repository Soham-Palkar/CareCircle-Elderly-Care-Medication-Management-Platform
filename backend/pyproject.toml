[project]
name = "carecircle-backend"
version = "0.1.0"
description = "CareCircle Elderly Care & Medication Management Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "slowapi>=0.1",
    "structlog>=24.1",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "freezegun>=1.4",
    "factory-boy>=3.3",
    "ruff",
    "black",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/domain", "app/services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
