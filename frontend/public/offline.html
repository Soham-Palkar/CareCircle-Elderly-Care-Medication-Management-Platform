<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCircle — Offline</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #FAF8F5;
      color: #2D2318;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      border: 2px solid #D6CCC0;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 480px;
      box-shadow: 0 4px 6px rgba(45,35,24,0.08);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #C97B4B;
    }
    p {
      font-size: 18px;
      color: #5C4A38;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #C97B4B;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are currently offline</h1>
    <p>CareCircle has cached your primary medicine schedule. When your internet connection resumes, all updates will sync automatically.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection</button>
  </div>
</body>
</html>
